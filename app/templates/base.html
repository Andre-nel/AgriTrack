<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AgriTrack{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <a href="{{ url_for('web.dashboard') }}" class="brand">AgriTrack</a>
      <nav class="topnav">
        <a href="{{ url_for('web.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('web.setup_farm') }}">Setup Farm</a>
        <a href="{{ url_for('web.farms_page') }}">Manage Farms</a>
      </nav>
    </header>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <ul class="flash-list">
        {% for category, message in messages %}
        <li class="flash {{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
